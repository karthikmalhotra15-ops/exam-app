<script>
const $=i=>document.getElementById(i);let MODE=localStorage.mode||'quiz';let files=[];
const u=new URL(location.href);if(u.searchParams.get('k')){localStorage.k=u.searchParams.get('k')}
const K=localStorage.k||'';if(K){const m=document.querySelector('link[rel=manifest]');if(m)m.href='/manifest.json?k='+encodeURIComponent(K)}
function shrink(f){return new Promise(res=>{const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,2400/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.9))};im.src=url})}
function draw(){const t=$('tray');t.innerHTML='';files.forEach((d,i)=>{const c=document.createElement('div');c.className='chip';c.innerHTML='<img src="'+d+'"><b>Page '+(i+1)+'</b>';
 const x=document.createElement('button');x.innerHTML='<svg viewBox="0 0 24 24" width="12" height="12" stroke="#fff" stroke-width="2.4" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg>';x.onclick=()=>{files.splice(i,1);draw()};c.appendChild(x);t.appendChild(c)});
 $('empty').style.display=files.length?'none':'block';const hasT=!!$('qt').value.trim();$('go').disabled=!files.length&&!hasT;$('go').textContent=files.length?'Send '+files.length+' page'+(files.length>1?'s':''):(hasT?'Send text':'Send')}
$('qt').oninput=draw;
function setMode(m){MODE=m;localStorage.mode=m;$('mq').className=m=='quiz'?'on':'';$('me').className=m=='essay'?'on':''}$('mq').onclick=()=>setMode('quiz');$('me').onclick=()=>setMode('essay');setMode(MODE);
for(const [b,i] of [['camb','cam'],['pickb','pick']]){$(b).onclick=()=>$(i).click();$(i).onchange=async e=>{for(const f of e.target.files)files.push(await shrink(f));e.target.value='';draw()}}
$('go').onclick=async()=>{if(!K){$('note').style.display='block';$('note').textContent='No key on this page. Open the setup link again.';return}
 const b=$('go');b.disabled=true;b.textContent='Working';$('out').style.display='none';
 try{let sub=null;try{const reg=await navigator.serviceWorker.ready;sub=(await reg.pushManager.getSubscription())}catch(e){}
 const r=await fetch('/exam',{method:'POST',headers:{'content-type':'application/json','x-token':K},body:JSON.stringify({images:files,text:$('qt').value,sub:sub?sub.toJSON():null,mode:MODE})});
  if(r.status==401){$('note').style.display='block';$('note').textContent='Wrong key. Open the setup link again.';return}
  const j=await r.json();$('out').textContent=j.reply||j.error;$('out').style.display='block';if(j.reply){const H=JSON.parse(localStorage.hist||'[]');H.unshift({t:new Date().toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'}),a:j.reply});localStorage.hist=JSON.stringify(H.slice(0,10));drawHist()}
  files=[];$('qt').value='';draw();if(j.id){$('note').style.display='block';$('note').textContent='Writing the full answer...';pollEssay(j.id)}else{$('note').style.display='block';$('note').textContent='Answered in '+j.secs+'s after 6 Opus checks. This is the final answer.'}}
 catch(e){$('note').style.display='block';$('note').textContent='Could not reach the server.'}finally{draw()}};
async function pollEssay(id){for(let i=0;i<70;i++){await new Promise(r=>setTimeout(r,4000));try{const r=await fetch('/latest',{headers:{'x-token':K}});const j=await r.json();if(j.essay&&j.essay.id==id){$('out').textContent=j.essay.text;$('out').style.display='block';$('note').textContent='Full answer ready. Parts were also sent to your watch.';const H=JSON.parse(localStorage.hist||'[]');H.unshift({t:j.essay.t+' essay',a:j.essay.text});localStorage.hist=JSON.stringify(H.slice(0,10));drawHist();return}}catch(e){}}$('note').textContent='Still working. Check your watch or reopen the app.'}
function drawHist(){const H=JSON.parse(localStorage.hist||'[]');$('hist').innerHTML=H.map(x=>'<details><summary>'+x.t+'</summary><pre></pre></details>').join('');$('hist').querySelectorAll('pre').forEach((p,i)=>p.textContent=H[i].a)}drawHist();
function b64(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}

 if(await Notification.requestPermission()!=='granted'){$('bell').textContent='Blocked';return}
 const k=(await (await fetch('/vapid')).json()).key;
 const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k)});
 const r=await fetch('/sub',{method:'POST',headers:{'content-type':'application/json','x-token':K},body:JSON.stringify(sub)});$('bell').textContent=r.ok?'Alerts on':('Failed '+r.status+(K?'':' no key'))}catch(e){$('bell').textContent='Err: '+String(e.message||e).slice(0,30)}}

 if(s&&K){const r=await fetch('/sub',{method:'POST',headers:{'content-type':'application/json','x-token':K},body:JSON.stringify(s)});$('bell').textContent=r.ok?'Alerts on':('Failed '+r.status)}else if(s&&!K){$('bell').textContent='No key'}}catch(e){}})}

function tab(t){localStorage.tab=t;$('vc').className=t=='c'?'on':'';$('ve').className=t=='e'?'on':'';$('ve').style.display=t=='e'?'flex':'none';$('tc').className=t=='c'?'on':'';$('te').className=t=='e'?'on':'';document.querySelector('h1').textContent=t=='c'?'Friday':'Practice test'}

 catch(e){w.textContent='Could not reach the server.'}finally{$('cs').disabled=false;$('log').scrollTop=1e9}};

(function(){const h=new Date().getHours();$('hi').textContent=h<5?'still up, karthik?':h<12?'morning, karthik':h<18?'hey karthik':'evening, karthik';$('sub').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
